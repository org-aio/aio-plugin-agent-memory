[package]
name = "aio-agent-memory-dev"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.99"
az-plugin-contract = { path = "../../aio-platform/lib/plugin/contract" }
az-plugin-runtime = { path = "../../aio-platform/lib/plugin/runtime" }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
uuid = { version = "1.23.1", features = ["v4"] }
async-trait = "0.1.89"
tracing-subscriber = "0.3.20"
getrandom = "0.4.2"
