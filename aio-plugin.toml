schema_version = 2

[plugin]
permissions = ["memory:compile"]

[plugin.marketplace]
title = "Agent Memory"
summary = "Agent 的可选记忆插件，管理知识空间、来源、知识图谱和独立授权的秘密。"
license = "MIT"
tags = ["Agent", "知识库", "记忆"]
parent = "https://github.com/zjarlin/aio-plugin-agent.git"

[plugin.runtime]
artifact = "dist/plugin.wasm"
host_version = ">=2026.9.11"

[plugin.frontend]
path = "dist/frontend"

[plugin.database]
migrations = "backend/migrations"

[plugin.capabilities]
database = true
cryptography = true
