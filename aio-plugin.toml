schema_version = 2

[plugin]
permissions = ["memory:compile"]

[plugin.marketplace]
title = "智能体记忆"
summary = "智能体的可选记忆插件，管理知识空间、来源、知识图谱和独立授权的秘密。"
license = "MIT"
tags = ["智能体", "知识库", "记忆"]
parent = "https://github.com/org-aio/aio-plugin-agent.git"
parent_title = "智能体"

[plugin.runtime]
artifact = "dist/plugin.wasm"
host_version = ">=2026.9.11"

[plugin.frontend]
path = "dist/frontend"

[plugin.database]
migrations = "backend/migrations"

[plugin.capabilities]
database = true
cryptography = true
